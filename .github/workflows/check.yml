name: Check

# The same gate as locally: typecheck, lint, format, tests and the Storybook
# build. Publishing stays manual (`npm run deploy:storybook`).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `prepare` builds the tokens, icons and llms.txt on install.
      - run: npm ci
      - run: npm run check
